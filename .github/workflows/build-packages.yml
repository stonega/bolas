name: Build packages

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    name: Build DEB and RPM
    runs-on: ubuntu-24.04
    container: debian:trixie-slim
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Install build and runtime dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            binutils ca-certificates cpio desktop-file-utils ffmpeg file fonts-dejavu-core git \
            gjs gir1.2-adw-1 gir1.2-gdkpixbuf-2.0 gir1.2-graphene-1.0 \
            gir1.2-gst-plugins-base-1.0 gir1.2-gstreamer-1.0 \
            gir1.2-gtk-4.0 gir1.2-pango-1.0 gstreamer1.0-libav \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            libglib2.0-bin libglib2.0-dev libgtk-4-bin libgtk-4-media-gstreamer \
            librsvg2-common meson ninja-build python3 rpm shared-mime-info unzip xz-utils

      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Check JavaScript
        run: |
          bun install --frozen-lockfile
          bunx --no-install biome check src tests

      - name: Build, test, and package
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            bash scripts/package.sh "$GITHUB_REF_NAME"
          else
            bash scripts/package.sh
          fi
          bash tests/test-packages.sh

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: bolas-packages
          path: |
            dist/*.deb
            dist/*.rpm
            dist/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
